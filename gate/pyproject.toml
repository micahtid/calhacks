[project]
name = "gate"
version = "0.1.0"
description = "Payment Gate Layer 2: features, training, evaluation and scoring"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "lightgbm>=4.5,<4.7",  # 4.7.0 crashes (access violation in LGBM_DatasetSetField) on Windows
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115"]

[project.scripts]
gate-train = "gatepy.train:main"
gate-eval = "gatepy.evaluate:main"
gate-fixtures = "gatepy.fixtures:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatepy", "features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
