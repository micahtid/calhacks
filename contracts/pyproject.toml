[project]
name = "calhacks-contracts"
version = "0.2.0"
description = "Shared schemas (issue #1) and MongoDB access for the Gate and the red-team loop"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pymongo>=4.10",
    "python-dotenv>=1.0",
]

[project.scripts]
contracts-ingest = "calhacks_contracts.ingest:main"
contracts-export = "calhacks_contracts.export:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mongomock>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calhacks_contracts"]
